[project]
name = "invoicepilot"
version = "0.1.0"
description = "Python CLI and API for Invoice Pilot"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "invoice2data>=1.0",
    # invoice2data's PDF text backend. Not pulled in by invoice2data itself,
    # and without it every PDF fails to read rather than parsing.
    "pypdfium2>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
invoicepilot = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The mockup generators are mostly HTML string literals. Wrapping a <div> at
# column 100 makes the markup harder to read, not easier.
"docs/flows/*/build.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
