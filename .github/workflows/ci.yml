name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e "services/api[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: services/api
        run: pytest

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: services/web
        run: npm install

      - name: Build
        working-directory: services/web
        run: npm run build
