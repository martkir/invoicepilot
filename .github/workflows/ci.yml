name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest

    # Most of the suite needs no backend and does not use this. The workspace
    # isolation tests do, and they are the ones worth having a service for:
    # what they assert is that a query filters on a column and that a key is
    # composite, neither of which a stand-in can prove. Without DATABASE_URL
    # they skip, which would be a green build that checked nothing.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: invoicepilot_test
          POSTGRES_USER: invoicepilot
          POSTGRES_PASSWORD: invoicepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoicepilot -d invoicepilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e "services/api[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://invoicepilot:invoicepilot@localhost:5432/invoicepilot_test
        run: pytest

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: services/web
        run: npm install

      - name: Build
        working-directory: services/web
        run: npm run build
