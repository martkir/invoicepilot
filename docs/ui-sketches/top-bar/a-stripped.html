<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A · Stripped</title>
<!-- The app's own stylesheets, so this sketch is the real UI rather than a
     re-drawing of it. The ONLY change is that <header> is gone. -->
<link rel="stylesheet" href="../../../frontend/src/styles/tokens.css"/>
<link rel="stylesheet" href="../../../frontend/src/styles/dashboard.css"/>
<style>
/* main's top padding assumed a 52px header above it; without one the content
   would otherwise start hard against the viewport edge. */
main { padding-top: 26px; }
</style>
</head>
<body>

<!-- No <header>: "Settings" had no page, "Dashboard" was the only destination,
     and the user menu had no menu behind it. Everything below is unchanged. -->

<main>
  <div class="grid">

    <section class="card sources">
      <div class="card-label">Email sources</div>
      <div class="source">
        <svg class="source-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2V14h5.3c-.2 1.2-1.6 3.6-5.3 3.6A5.6 5.6 0 1 1 15.7 8l2.7-2.6A9.3 9.3 0 0 0 12 3a9 9 0 1 0 0 18c5.2 0 8.6-3.6 8.6-8.7 0-.6 0-1-.1-1.5H12z"/></svg>
        <span class="source-mail">kiraesq124@gmail.com</span>
        <button class="icon-btn" aria-label="Disconnect kiraesq124@gmail.com"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18.4 10.6a4.5 4.5 0 0 0-6.4-6.3l-1.4 1.4M5.6 13.4a4.5 4.5 0 0 0 6.4 6.3l1.4-1.4M2 2l20 20"/></svg></button>
      </div>
      <button class="add-source"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add source</button>
      <div class="accounts-note"><span class="dot"></span>1 account connected</div>
    </section>

    <section class="card">
      <div class="table-head">
        <div class="table-title">Invoices <em>5 documents</em></div>
        <div class="tools">
          <span class="last-update">Updated just now</span>
          <div class="tool-divider"></div>
          <button class="update-btn" data-busy="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg><span>Update</span></button>
          <div class="tool-divider"></div>
          <button class="icon-btn" aria-label="Download selected"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
          <button class="icon-btn" aria-label="Expand table"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" aria-label="Select all invoices"></th>
            <th>Vendor</th>
            <th class="col-amount sortable"><button>Amount <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/></svg></button></th>
            <th class="col-issued sortable sorted"><button>Issued <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-check"><input type="checkbox" aria-label="Select Bolt Operations OÜ invoice"></td>
            <td><div class="vendor"><span class="vendor-logo" style="background:#34A853">Bo</span>
              <span><span class="vendor-name">Bolt Operations OÜ</span></span></div></td>
            <td class="col-amount">2.37 €</td>
            <td class="col-issued">06.08.2026</td>
            <td class="col-actions"><div class="row-actions"><button class="icon-btn" aria-label="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon-btn" aria-label="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="icon-btn" aria-label="More options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></td>
          </tr>
          <tr>
            <td class="col-check"><input type="checkbox" aria-label="Select Amazon invoice"></td>
            <td><div class="vendor"><span class="vendor-logo" style="background:#232F3E">Am</span>
              <span><span class="vendor-name">Amazon</span></span></div></td>
            <td class="col-amount">64.90 €</td>
            <td class="col-issued">02.08.2026</td>
            <td class="col-actions"><div class="row-actions"><button class="icon-btn" aria-label="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon-btn" aria-label="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="icon-btn" aria-label="More options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></td>
          </tr>
          <tr>
            <td class="col-check"><input type="checkbox" aria-label="Select Figma invoice"></td>
            <td><div class="vendor"><span class="vendor-logo" style="background:#0D0D0D">Fi</span>
              <span><span class="vendor-name">Figma</span></span></div></td>
            <td class="col-amount">15.00 €</td>
            <td class="col-issued">01.08.2026</td>
            <td class="col-actions"><div class="row-actions"><button class="icon-btn" aria-label="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon-btn" aria-label="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="icon-btn" aria-label="More options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></td>
          </tr>
          <tr>
            <td class="col-check"><input type="checkbox" aria-label="Select Slack invoice"></td>
            <td><div class="vendor"><span class="vendor-logo" style="background:#4A154B">Sl</span>
              <span><span class="vendor-name">Slack</span></span></div></td>
            <td class="col-amount">21.75 €</td>
            <td class="col-issued">28.07.2026</td>
            <td class="col-actions"><div class="row-actions"><button class="icon-btn" aria-label="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon-btn" aria-label="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="icon-btn" aria-label="More options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></td>
          </tr>
          <tr>
            <td class="col-check"><input type="checkbox" aria-label="Select Uber invoice"></td>
            <td><div class="vendor"><span class="vendor-logo" style="background:#0D0D0D">Ub</span>
              <span><span class="vendor-name">Uber</span></span></div></td>
            <td class="col-amount">12.40 €</td>
            <td class="col-issued">24.07.2026</td>
            <td class="col-actions"><div class="row-actions"><button class="icon-btn" aria-label="Preview"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon-btn" aria-label="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><button class="icon-btn" aria-label="More options"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></td>
          </tr>
        </tbody>
      </table>

      <div class="table-foot">
        <span class="per-page">5 of 5 shown</span>
        <span class="pager"><span class="page-num">1</span></span>
      </div>
    </section>

  </div>
</main>
</body>
</html>
