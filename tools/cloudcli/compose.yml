# CloudCLI, on port 3011, reachable from other machines.
#
#   docker compose -f tools/cloudcli/compose.yml up -d --build
#   docker compose -f tools/cloudcli/compose.yml logs -f
#
# Under tools/ rather than services/: CloudCLI is a tool that drives this
# machine, not a service InvoicePilot depends on, so `docker compose up` on the
# project stack should neither start nor stop it.
#
# The project name is set explicitly for the same reason — without it compose
# would name the project after whichever directory it was invoked from, and two
# stacks sharing a name each report the other's containers as orphans.
name: cloudcli

services:
  cloudcli:
    build:
      context: .
    container_name: cloudcli
    # Same uid:gid as the host account, because the mount below is that
    # account's home directory and the files written into it must stay usable
    # from outside the container.
    user: "1000:1000"
    ports:
      # The 0.0.0.0 prefix is what makes this reachable remotely rather than
      # from the host alone. Anyone who can reach this port gets a shell on
      # this machine through the UI, so keep it behind a firewall rule.
      - "0.0.0.0:3011:3011"
    environment:
      SERVER_PORT: 3011
      HOST: 0.0.0.0
      HOME: /home/clickhouse
      CLAUDE_CLI_PATH: /home/clickhouse/.local/bin/claude
    volumes:
      # The whole home directory, mounted at its own path. CloudCLI reads the
      # project list out of ~/.claude/projects, which records absolute paths —
      # mounting the projects anywhere else would leave every one of them
      # pointing at a directory the container cannot see. This also carries in
      # ~/.claude credentials and persists ~/.cloudcli/auth.db across restarts.
      - /home/clickhouse:/home/clickhouse
    restart: unless-stopped
