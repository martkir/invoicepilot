# Serves the built dashboard and gives it a same-origin /api, which is what the
# Vite dev proxy does in development. Without this the React app loads and then
# fails every request: the browser resolves /api against the container, and
# nothing there answers it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # The API runs on the host, not in this container. host.docker.internal
        # only resolves when the container is started with
        #   --add-host=host.docker.internal:host-gateway
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A scan is slow; do not cut the poll off mid-flight.
        proxy_read_timeout 300s;
    }

    # Vite fingerprints these, so the name changes whenever the bytes do and
    # they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html keeps its name across deploys, so it must be revalidated every
    # time. Without this nginx sends only ETag/Last-Modified, browsers apply
    # heuristic caching, and a redeploy keeps serving the previous build until
    # the user thinks to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
